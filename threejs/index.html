<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizXtreme — The Living Frontier</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#050812;color:#fff;font-family:Inter,system-ui,sans-serif}#app{height:100%}.hud{position:fixed;inset:0;pointer-events:none}.panel{pointer-events:auto;background:rgba(5,8,18,.84);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.35)}#menu{position:absolute;left:24px;top:24px;width:300px;padding:18px}.brand{font-size:22px;font-weight:800;letter-spacing:.08em}.subtitle{opacity:.65;font-size:12px;margin:4px 0 18px}.button{width:100%;margin:5px 0;padding:11px;border:0;border-radius:9px;background:#17243a;color:white;text-align:left;cursor:pointer}.button:hover{background:#243b61}.primary{background:#3b6eea}.badge{display:inline-block;padding:4px 7px;border-radius:20px;background:#153c2d;color:#76f2b5;font-size:11px}.bottom{position:absolute;right:24px;bottom:24px;padding:14px 18px;min-width:220px}.toast{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);padding:10px 16px;opacity:0;transition:.25s}.toast.show{opacity:1}</style></head>
