n:load 2.2s ease forwards}@keyframes load{to{width:100%}}.game-dashboard{position:fixed;z-index:30;inset:6vh 8vw;padding:22px;overflow:auto}.dash-head{display:flex;justify-content:space-between;align-items:center;font-size:18px}.dash-head small{display:block;opacity:.55;font-size:11px;margin-top:3px}.dash-close{background:none;color:#fff;border:0;font-size:28px;cursor:pointer}.kpi-grid{display:grid;grid-template-columns:repeat(6,minmax(90px,1fr));gap:10px;margin:18px 0}.kpi{padding:14px;border-radius:12px;background:rgba(30,50,78,.6);border:1px solid rgba(150,220,255,.12)}.kpi span{display:block;opacity:.6;font-size:11px}.kpi b{font-size:23px}.dash-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.dash-grid>div{padding:16px;border-radius:12px;background:rgba(9,18,32,.72);border:1px solid rgba(255,255,255,.1)}.dash-grid button{margin:4px;padding:8px 10px;border:0;border-radius:8px;background:#21476d;color:#fff}.dash-grid input{max-width:100%;padding:8px;border-radius:7px;border:1px solid #35516f;background:#08111d;color:#fff}.save-status{display:block;margin-top:10px;opacity:.65;font-size:11px}.hall-row,.peer{display:grid;grid-template-columns:36px 1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07)}.peer{grid-template-columns:1fr auto}.peer small{opacity:.5}@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(3,1fr)}.dash-grid{grid-template-columns:1fr}.game-dashboard{inset:2vh 3vw}.bottom{display:none}}</style></head><body><div class="splash" id="splash"><div class="splash-card"><div class="splash-title">BIZXTREME</div><div class="splash-sub">AURORA FRONTIER</div><div class="splash-bar"><i></i></div></div></div><div id="app"></div><div class="hud"><div id="menu" class="panel"><div class="brand">BIZXTREME</div><div class="subtitle">THE LIVING FRONTIER</div><span class="badge">STARTER PACK READY</span><button class="button primary" data-action="play">▶ Play</button><button class="button" data-action="continue">Continue</button><button class="button" data-action="dashboard">Dashboard</button><button class="button" data-action="missions">Missions</button><button class="button" data-action="events">Events</button><button class="button" data-action="inventory">Inventory</button><button class="button" data-action="marketplace">Marketplace</button><button class="button" data-action="wallet">Wallet</button><button class="button" data-action="settings">Settings</button></div><div class="bottom panel"><strong>Frontier Status</strong><br><small>Chapter 1 · Awakening<br>Save/resume enabled · Local Hall of Fame</small></div><div id="toast" class="toast panel"></div></div><script>addEventListener('load',()=>setTimeout(()=>document.getElementById('splash').classList.add('hidden'),2200));</script><script type="module" src="./src/main.js"></script></body></html>
